<button class="mb-6 flex items-center gap-2 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 cursor-pointer"
  (click)="toggleWeekCalendar()">
  <i class="pi pi-calendar"></i>
  Calendar
</button>

<p-dialog header="Weekly Sales Calendar" [modal]="true" [(visible)]="showWeekCalendar" [style]="{ width: '50rem' }"
  [contentStyle]="{ overflow: 'hidden' }" [breakpoints]="{ '1199px': '75vw', '575px': '95vw' }" [maximizable]="true"
  [focusOnShow]="false">
  <div *ngIf="loadingCalendar" class="text-sm text-gray-400 mb-4">
    Loading calendar...
  </div>

  <div class="w-full max-w-full overflow-hidden">

    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">

      <div>
        <div class="text-sm font-semibold text-gray-700">
          {{ selectedDatabaseName }}
        </div>
        <div class="text-xs text-gray-400">
          Weekly schedule
        </div>
      </div>

      <div class="flex items-center gap-3 w-full md:w-auto">
        <p-datepicker [(ngModel)]="selectedCalendarDate" dateFormat="yy-mm-dd" [showIcon]="true"
          (onSelect)="onCalendarDateChange()" appendTo="body" styleClass="w-full md:w-auto" inputStyleClass="w-full">
        </p-datepicker>
      </div>

    </div>

    <div class="w-full max-w-full overflow-x-auto">

      <table class="w-full border-collapse table-fixed">

        <thead>
          <tr>
            <th class="border bg-gray-100 p-3 text-left text-sm font-semibold text-gray-700 w-[140px]">
              Area
            </th>

            <th *ngFor="let day of weekDays"
              class="border bg-gray-100 p-3 text-center text-sm font-semibold text-gray-700">
              <div class="truncate">
                {{ day.label }}
              </div>

              <div class="text-xs text-gray-500 truncate">
                {{ day.date }}
              </div>
            </th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let area of areas">

            <td class="border p-3 font-semibold text-gray-800 bg-gray-50 align-top break-words">
              {{ area.name }}
            </td>

            <td *ngFor="let day of weekDays" class="border p-2 align-top h-24">

              <div *ngIf="getSalesCalendarByAreaAndDate(area.id, day.date).length === 0"
                class="text-xs text-gray-400 text-center py-4">
                No records
              </div>

              <div *ngFor="let item of getSalesCalendarByAreaAndDate(area.id, day.date)"
                class="bg-blue-50 border border-blue-100 rounded-lg p-2 mb-2 max-w-full overflow-hidden">

                <div class="flex items-center gap-2 min-w-0">
                  <!-- <i class="pi pi-user text-blue-600 text-xs shrink-0"></i> -->

                  <span class="text-sm font-thin text-gray-800 truncate"
                    [pTooltip]="getSalespersonName(item.salesperson_id)" tooltipPosition="top">
                    {{ getSalespersonName(item.salesperson_id) }}
                  </span>
                </div>

              </div>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</p-dialog>
