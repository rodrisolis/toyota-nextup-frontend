<div class="min-h-screen w-full bg-gray-100 flex flex-col">

  <!-- HEADER -->
  <header class="w-full bg-white shadow-sm">

    <div class="max-w-7xl mx-auto px-4 md:px-8 py-4">

      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">

        <!-- LEFT SECTION -->
        <div class="flex flex-col sm:flex-row sm:items-center gap-4 flex-1 min-w-0">

          <!-- LOGOS -->
          <div class="flex items-center justify-center sm:justify-start gap-3 shrink-0">

            <img
              src="logo-daltonb.png"
              alt="Dalton Logo"
              class="h-10 md:h-14 object-contain" />

            @if (env.includes('ty')) {

              <img
                src="toyota-logo.png"
                alt="Toyota Logo"
                class="h-10 md:h-14 object-contain" />

            } @else {

              <img
                src="subaru-logo.png"
                alt="Subaru Logo"
                class="h-10 md:h-14 object-contain" />

            }

          </div>

          <!-- TITLE -->
          <div class="flex-1 min-w-0">

            <h1 class="text-lg sm:text-xl md:text-2xl lg:text-3xl font-bold text-gray-800 text-center lg:text-left break-words leading-tight">
              Sales Floor Dashboard Toyota South
            </h1>

          </div>

        </div>

        <!-- LOGIN BUTTON -->
        <div class="flex justify-center lg:justify-end shrink-0">

          <a
            href="/"
            target="_blank"
            class="flex items-center gap-2 px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-100 transition cursor-pointer">

            <i class="pi pi-sign-in"></i>
            Login

          </a>

        </div>

      </div>

    </div>

  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 w-full max-w-7xl mx-auto p-4 md:p-8">

    <div class="space-y-6">

      <app-calendar [env]="env" branchOverride="south"></app-calendar>

      <app-live-floor-tertiary [env]="env" branchOverride="south"></app-live-floor-tertiary>

    </div>

  </main>

</div>
